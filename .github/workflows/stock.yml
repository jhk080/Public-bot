name: Daily Stock Screener

on:
  schedule:
    - cron: '0 6 * * 1-5'  # 매주 월~금요일 UTC 06:00 (한국 시간 오후 3시 00분)
  workflow_dispatch:        # 수동으로 즉시 실행할 수 있는 버튼 제공

jobs:
  run-screener:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install pandas numpy requests beautifulsoup4 finance-datareader

      - name: Run stock screener
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python main.py
